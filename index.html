<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Score Desk</title>
<style>
:root{--bg:#02050b;--card:#0a1220;--line:#16294a;--txt:#f5f9ff;--mut:#7f95b8;--first:#e8f3ff;--blue:#2f80ed;--sky:#5db0ff;--deep:#1556b8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Trebuchet MS",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(ellipse at 50% -10%,#0b2150 0%,#02050b 60%) fixed;min-height:100vh;color:var(--txt)}
body.display{background:transparent;min-height:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}
#ctl{max-width:480px;margin:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;justify-content:center;margin:2px 0 6px}.brand img{height:54px;border-radius:10px}
.top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:10px;letter-spacing:.08em}
.live{color:var(--sky);text-shadow:0 0 8px rgba(93,176,255,.7)}.live.off{color:#7f8aa0;text-shadow:none}
.seg{display:flex;margin-bottom:10px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#050b17}
.seg button{flex:1;padding:10px;background:transparent;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:linear-gradient(90deg,var(--deep),var(--blue));color:#fff;box-shadow:0 0 14px rgba(47,128,237,.6) inset}
.nav{display:flex;gap:8px;margin-bottom:10px}
.nav button{padding:16px;border-radius:16px;font-weight:900;font-size:18px;color:#fff}
.nav .p{flex:1;background:var(--card);border:1px solid var(--line)}
.nav .n{flex:2.4;background:linear-gradient(90deg,var(--deep),var(--blue) 55%,var(--sky));box-shadow:0 4px 22px rgba(47,128,237,.45)}
.hint{text-align:center;font-size:10px;color:var(--mut);margin-bottom:10px}
.row{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#0c1730,var(--card));border:1px solid var(--line);border-left:5px solid #22375f;border-radius:6px 16px 16px 6px;padding:8px 10px;margin-bottom:7px}
.row.r1{border-color:var(--sky);border-left-color:#fff;background:linear-gradient(90deg,#123a7a,#0a1a38);box-shadow:0 0 18px rgba(93,176,255,.35)}
.row.r2{border-left-color:var(--blue);background:linear-gradient(90deg,#0f2650,var(--card))}
.nm{flex:1;min-width:0;font-weight:700;font-size:14px}
.nm small{display:inline-block;margin-left:6px;font-size:9px;padding:1px 7px;border-radius:999px;background:#16294a;color:#a9c4ee}
.sc{font-size:24px;font-weight:900;min-width:54px;text-align:right;cursor:pointer;border-bottom:1px dashed #2c4574}
.row.r1 .sc{color:#fff;text-shadow:0 0 12px rgba(93,176,255,.9)}.row.r2 .sc{color:var(--sky)}
.b{width:38px;height:38px;border-radius:50%;font-weight:800;font-size:12px;color:#fff;flex:none}.b.h{font-size:10px}
.b.g{background:linear-gradient(145deg,var(--blue),var(--deep));box-shadow:0 2px 10px rgba(47,128,237,.5)}
.b.l{background:linear-gradient(145deg,#8fcbff,var(--sky));color:#02203f}
.b.m{background:#101c33;border:1px solid #2c4574;color:#a9c4ee}
details{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:13px}
summary{font-weight:700;color:var(--mut);font-size:11px;letter-spacing:.08em}
details label{display:block;margin:8px 0 3px;color:var(--mut);font-size:11px}
details input,details textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#02050b;color:#fff;font:inherit;font-size:13px}
details .act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
details .act button{padding:9px 12px;border-radius:999px;background:#16294a;font-weight:700;font-size:12px}
details .act .dng{background:#3a1d2c;color:#ffb3c4}
.links a{color:var(--sky);word-break:break-all;font-size:11px}
#dsp{display:none;width:100%;padding:6px}
body.display #ctl{display:none}body.display #dsp{display:flex;gap:10px}
.tile{flex:1;min-width:0;background:linear-gradient(180deg,rgba(12,28,60,.95),rgba(2,6,14,.96));border:1px solid #16294a;border-bottom:5px solid #22375f;border-radius:16px 16px 6px 6px;padding:10px 4px 8px;text-align:center;transition:.3s}
.tile .rk{display:inline-block;font-size:clamp(9px,1.1vw,14px);font-weight:800;padding:1px 9px;border-radius:999px;background:#16294a;color:#a9c4ee}
.tile .tn{font-size:clamp(10px,1.3vw,18px);font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c5d8f5}
.tile .ts{font-size:clamp(22px,3.6vw,56px);font-weight:900;line-height:1.1}
.tile.r1{background:linear-gradient(180deg,#14468f,#06122a);border-color:var(--sky);border-bottom-color:#fff;box-shadow:0 0 26px rgba(93,176,255,.6)}
.tile.r1 .ts{color:#fff;text-shadow:0 0 14px rgba(93,176,255,.95)}.tile.r1 .rk{background:#fff;color:#0a2a5c}.tile.r1 .tn{color:#fff}
.tile.r2{border-color:var(--blue);border-bottom-color:var(--blue);box-shadow:0 0 14px rgba(47,128,237,.35)}
.tile.r2 .ts{color:var(--sky)}.tile.r2 .rk{background:var(--blue);color:#fff}
.tile.bump{transform:translateY(-6px) scale(1.06)}
</style></head>

<div id="dsp"></div>

<script>
const Q=new URLSearchParams(location.search);
const MODE=Q.get('mode')==='display'?'display':'control';
const LS=(k,v)=>v===undefined?localStorage.getItem(k):localStorage.setItem(k,v);
let ROOM=Q.get('room')||LS('qs_room')||'quiz1';
const DEF_URL='https://daeunvrbadtnpktxqyuo.supabase.co',DEF_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZXVudnJiYWR0bnBrdHhxeXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODkzMDUsImV4cCI6MjEwNjg2NTMwNX0.Z8xkPWmArATWBqcck92_8sI6H498uMAOgs4aNG5NX4U';
let SB={url:DEF_URL,key:DEF_KEY};
const remote=()=>SB.url&&SB.key;
const defNames=['Team 1','Team 2','Team 3','Team 4','Team 5','Team 6','Team 7','Team 8'];
let S={teams:defNames.map(n=>({n,s:0})),mode:'pos',rev:0,cmd:'',seq:0};
let hist=[];
if(MODE==='display')document.body.classList.add('display');

/* ---------- ranking (competition ranking: 190,170,170,170,160,160,90,45 -> 1,2,2,2,5,5,7,8) ---------- */
function ranks(){const sorted=[...S.teams.map(t=>t.s)].sort((a,b)=>b-a);return S.teams.map(t=>sorted.indexOf(t.s)+1)}
const ord=r=>r===1?'1ST':r===2?'2ND':r===3?'3RD':'#'+r;
function cls(r){if(r===1)return'r1';if(r===2&&S.mode==='pos')return'r2';return''}

/* ---------- storage / sync ---------- */
const hdr=()=>({apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'});
async function push(){
  S.rev=Date.now();
  const body={room:ROOM,state:S,cmd:S.cmd,cmd_seq:S.seq,updated_at:new Date().toISOString()};
  LS('qs_state_'+ROOM,JSON.stringify(S));
  if(!remote())return setLive(true);
  try{
    const r=await fetch(SB.url+'/rest/v1/quiz_rooms?on_conflict=room',{method:'POST',headers:{...hdr(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});
    setLive(r.ok);
  }catch(e){setLive(false)}
}
async function pull(){
  try{
    if(remote()){
      const r=await fetch(SB.url+'/rest/v1/quiz_rooms?room=eq.'+encodeURIComponent(ROOM)+'&select=state',{headers:hdr()});
      if(!r.ok)return setLive(false);
      const j=await r.json();setLive(true);
      if(j[0]&&j[0].state&&j[0].state.rev!==S.rev){S=j[0].state;render()}
    }else{
      const raw=LS('qs_state_'+ROOM);
      if(raw){const o=JSON.parse(raw);if(o.rev!==S.rev){S=o;render()}}
    }
  }catch(e){setLive(false)}
}
function setLive(ok){const l=document.getElementById('live');if(!l)return;l.classList.toggle('off',!ok);l.textContent=ok?'● LIVE':'● OFFLINE'}

/* ---------- controller actions ---------- */
function snap(){hist.push(JSON.stringify(S));if(hist.length>50)hist.shift()}
const rnd=x=>Math.round(x*100)/100;
const fmt=x=>Number.isInteger(x)?String(x):String(rnd(x));
function add(i,d){snap();S.teams[i].s=rnd(S.teams[i].s+d);render();push()}
function custom(i){
  const t=S.teams[i];
  const v=prompt(t.n+' — current '+fmt(t.s)+'\n\nEnter points to add (e.g. 2.5 or -3).\nTo set an exact score, start with = (e.g. =75).','');
  if(v===null||!v.trim())return;
  const s=v.trim();const exact=s[0]==='=';
  const n=parseFloat(exact?s.slice(1):s);
  if(isNaN(n))return alert('Not a valid number');
  snap();t.s=rnd(exact?n:t.s+n);render();push();
}
function setMode(m){S.mode=m;render();push()}
function cmd(a){S.cmd=a;S.seq++;push();if(navigator.vibrate)navigator.vibrate(30)}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());render();push()}
function resetScores(){if(!confirm('Reset all scores to 0?'))return;snap();S.teams.forEach(t=>t.s=0);render();push()}
function saveNames(){
  const n=document.getElementById('names').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12);
  if(!n.length)return;snap();
  S.teams=n.map((nm,i)=>({n:nm,s:S.teams[i]?S.teams[i].s:0}));render();push();
}
function saveCfg(){
  ROOM=document.getElementById('roomIn').value.trim()||'quiz1';
  LS('qs_room',ROOM);
  render();push();
}

/* ---------- render ---------- */
function render(){
  const R=ranks();
  if(MODE==='display'){
    const d=document.getElementById('dsp');
    const prev={};d.querySelectorAll('.tile').forEach((t,i)=>prev[i]=t.dataset.s);
    d.innerHTML=S.teams.map((t,i)=>`<div class="tile ${cls(R[i])}" data-s="${t.s}"><span class="rk">${ord(R[i])}</span><div class="tn">${esc(t.n)}</div><div class="ts">${fmt(t.s)}</div></div>`).join('');
    d.querySelectorAll('.tile').forEach((t,i)=>{if(prev[i]!==undefined&&prev[i]!==t.dataset.s){t.classList.add('bump');setTimeout(()=>t.classList.remove('bump'),350)}});
    return;
  }
  document.getElementById('room').textContent=ROOM;
  document.getElementById('mPos').classList.toggle('on',S.mode==='pos');
  document.getElementById('mTop').classList.toggle('on',S.mode==='top');
  document.getElementById('rows').innerHTML=S.teams.map((t,i)=>`<div class="row ${cls(R[i])}"><div class="nm">${esc(t.n)}<small>${ord(R[i])}</small></div><div class="sc" onclick="custom(${i})" title="Tap for custom score">${fmt(t.s)}</div><button class="b g" onclick="add(${i},10)">+10</button><button class="b l" onclick="add(${i},1)">+1</button><button class="b l h" onclick="add(${i},0.5)">+0.5</button><button class="b m" onclick="add(${i},-5)">−5</button></div>`).join('');
  const a=document.activeElement;
  if(!a||a.id!=='names')document.getElementById('names').value=S.teams.map(t=>t.n).join('\n');
  if(!a||a.tagName!=='INPUT'){roomIn.value=ROOM}
  const u=location.origin&&location.origin!=='null'?location.origin+location.pathname:location.href.split('?')[0];
  const link=u+'?mode=display&room='+encodeURIComponent(ROOM);
  const dl=document.getElementById('dLink');dl.href=link;dl.textContent=link;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('mPos').onclick=()=>setMode('pos');
document.getElementById('mTop').onclick=()=>setMode('top');

/* init */
(function(){
  const raw=LS('qs_state_'+ROOM);if(raw){try{S=JSON.parse(raw)}catch(e){}}
  render();
  if(MODE==='control'){push()}
  setInterval(()=>{if(MODE==='display')pull()},600);
  window.addEventListener('storage',()=>{if(MODE==='display')pull()});
  if(MODE==='display')pull();
})();

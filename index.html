<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Score Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>:root{--orange:#FF6B00;--orange-light:#FF9A3C;--orange-pale:#FFF3E6;--orange-dark:#C74E00;--cream:#FFFBF5;--ink:#1A0A00;--gold:#FFC400;--gold-deep:#E39A00;--red:#C70000;--shadow:#FF6B0033;
--bg:var(--cream);--card:#fff;--line:var(--orange);--txt:var(--ink);--mut:#9a5a2a;--first:var(--orange-dark);--second:var(--orange);--acc:var(--orange);--p10:var(--orange-dark);--p5:#F2A900;--m5:var(--red)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 15% 0,#fff 0,transparent 45%),repeating-linear-gradient(45deg,rgba(255,107,0,.045) 0 14px,transparent 14px 28px),var(--cream);min-height:100vh;color:var(--ink);overflow-x:hidden}
body.display{background:transparent;min-height:0}
body.display::before,body.display::after{display:none}
/* zigzag borders */
body::before{content:'';display:block;height:20px;background:linear-gradient(135deg,var(--orange) 25%,transparent 25%) -10px 0,linear-gradient(225deg,var(--orange) 25%,transparent 25%) -10px 0,linear-gradient(315deg,var(--orange) 25%,transparent 25%),linear-gradient(45deg,var(--orange) 25%,transparent 25%);background-size:20px 20px;background-color:var(--orange-light)}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:12px;background:linear-gradient(135deg,var(--orange-light) 25%,transparent 25%) -6px 0,linear-gradient(225deg,var(--orange-light) 25%,transparent 25%) -6px 0,linear-gradient(315deg,var(--orange-light) 25%,transparent 25%),linear-gradient(45deg,var(--orange-light) 25%,transparent 25%);background-size:12px 12px;background-color:var(--orange-dark);pointer-events:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;transition:transform .15s,box-shadow .15s,filter .15s}
button:active{transform:translate(2px,3px)!important;box-shadow:0 0 0 var(--ink)!important}
#ctl{max-width:480px;margin:auto;padding:0 12px 40px;padding-top:0}
/* header band */
.top{display:flex;justify-content:space-between;align-items:center;font-family:'Bangers',Impact,'Arial Black',sans-serif;font-size:24px;font-weight:400;color:#fff;letter-spacing:3px;text-shadow:2px 3px 0 var(--orange-dark);background:linear-gradient(180deg,var(--orange-light),var(--orange) 55%,var(--orange-dark));margin:0 -12px 14px;padding:16px 14px 14px;position:relative;overflow:hidden;border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--gold)}
.top::after{content:'🏆';position:absolute;right:-6px;top:-18px;font-size:92px;opacity:.14;transform:rotate(14deg);pointer-events:none}
.top #room{display:inline-block;margin-left:4px;padding:0 10px;font-size:16px;letter-spacing:1.5px;background:var(--ink);color:var(--gold);border-radius:999px;text-shadow:none;vertical-align:3px}
.live{font-family:'Nunito',sans-serif;font-size:11px;font-weight:900;letter-spacing:1px;text-shadow:none;background:#fff;color:#0a7a3a;padding:5px 11px;border-radius:999px;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);position:relative;z-index:1}
.live.off{color:var(--red)}
.seg{display:flex;margin-bottom:14px;border:3px solid var(--orange);border-radius:999px;overflow:hidden;background:#fff;box-shadow:5px 5px 0 var(--orange-light)}
.seg button{flex:1;padding:12px 8px;background:transparent;font-weight:900;font-size:13px;color:var(--orange-dark);letter-spacing:.3px}
.seg button.on{background:linear-gradient(180deg,var(--orange-light),var(--orange));color:#fff;text-shadow:1px 2px 0 var(--orange-dark)}
.nav{display:flex;gap:10px;margin-bottom:8px}
.nav button{padding:16px;border-radius:14px;font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;font-size:24px;letter-spacing:2px;border:3px solid var(--ink)}
.nav .p{flex:1;background:#fff;color:var(--orange-dark);box-shadow:4px 4px 0 var(--orange-light)}
.nav .n{flex:2.4;color:#fff;text-shadow:2px 2px 0 var(--orange-dark);background:linear-gradient(180deg,var(--orange-light),var(--orange) 60%,var(--orange-dark));box-shadow:4px 4px 0 var(--ink)}
.hint{text-align:center;font-size:10px;font-weight:700;color:var(--mut);margin-bottom:14px}
/* team rows */
.row{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--orange);border-left-width:9px;border-radius:8px 18px 18px 8px;padding:9px 10px;margin-bottom:11px;box-shadow:4px 4px 0 var(--orange-light);position:relative}
.row.r1{border-color:var(--gold-deep);border-left-color:var(--orange-dark);background:linear-gradient(100deg,#fff1b8,#ffd75e);box-shadow:5px 5px 0 var(--orange-dark)}
.row.r1::before{content:'👑';position:absolute;left:-6px;top:-18px;font-size:22px;transform:rotate(-18deg)}
.row.r2{border-left-color:var(--orange-dark);background:var(--orange-pale)}
.nm{flex:1;min-width:0;font-weight:900;font-size:14px;color:var(--ink)}
.nm small{display:inline-block;margin-left:6px;font-size:10px;font-weight:900;padding:2px 8px;border-radius:6px;background:var(--orange-dark);color:#fff;letter-spacing:.5px;vertical-align:1px}
.sc{font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;font-size:34px;width:66px;text-align:right;color:var(--orange);text-shadow:2px 2px 0 rgba(26,10,0,.12);line-height:1}
.row.r1 .sc{color:var(--orange-dark)}.row.r2 .sc{color:var(--orange)}
.b{width:46px;height:46px;border-radius:50%;font-weight:900;font-size:13px;color:#fff;border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}
.b.g{background:var(--orange-dark)}.b.l{background:var(--gold);color:var(--ink)}.b.m{background:var(--red)}
details{margin-top:14px;background:#fff;border:3px solid var(--orange);border-radius:16px;padding:12px;font-size:13px;box-shadow:5px 5px 0 var(--orange-light)}
summary{font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;color:var(--orange);font-size:18px;letter-spacing:2px;cursor:pointer}
details label{display:block;margin:10px 0 4px;color:var(--orange-dark);font-weight:800;font-size:11px;letter-spacing:.5px}
details input,details textarea{width:100%;padding:10px 12px;border-radius:10px;border:2.5px solid var(--orange);background:var(--orange-pale);color:var(--ink);font:inherit;font-weight:700;font-size:13px;outline:none}
details input:focus,details textarea:focus{box-shadow:0 0 0 3px var(--shadow)}
details .act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
details .act button{padding:10px 14px;border-radius:10px;background:var(--orange);color:#fff;font-weight:900;font-size:12px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
details .act .dng{background:var(--red)}
.links a{color:var(--orange-dark);font-weight:700;word-break:break-all;font-size:11px}
/* display (projector / OBS) */
#dsp{display:none;width:100%;padding:clamp(18px,2.6vw,40px) 10px 14px}
body.display #ctl{display:none}body.display #dsp{display:flex;gap:12px;align-items:flex-end}
.tile{flex:1;min-width:0;position:relative;background:linear-gradient(180deg,#fff,var(--orange-pale));border:clamp(2px,.3vw,4px) solid var(--orange);border-radius:18px;padding:10px 4px 10px;text-align:center;box-shadow:clamp(3px,.4vw,6px) clamp(3px,.4vw,6px) 0 var(--orange-dark);transition:.3s}
.tile .rk{display:inline-block;font-family:'Bangers',Impact,'Arial Black',sans-serif;font-size:clamp(11px,1.5vw,22px);font-weight:400;letter-spacing:1.5px;padding:1px 12px;border-radius:999px;background:var(--orange);color:#fff;text-shadow:1px 2px 0 var(--orange-dark)}
.tile .tn{font-size:clamp(10px,1.3vw,18px);font-weight:900;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);padding:0 4px}
.tile .ts{font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;font-size:clamp(26px,4.6vw,72px);line-height:1.05;color:var(--orange);text-shadow:2px 3px 0 rgba(199,78,0,.25);letter-spacing:1px}
.tile.r1{background:linear-gradient(180deg,#fff3c0,var(--gold));border-color:var(--ink);box-shadow:clamp(3px,.4vw,6px) clamp(3px,.4vw,6px) 0 var(--ink),0 0 28px rgba(255,196,0,.8);padding-top:clamp(14px,1.8vw,26px)}
.tile.r1::before{content:'👑';position:absolute;left:50%;top:clamp(-22px,-1.8vw,-12px);transform:translateX(-50%) rotate(-8deg);font-size:clamp(16px,2.6vw,38px);line-height:1}
.tile.r1 .rk{background:var(--ink);color:var(--gold);text-shadow:none}
.tile.r1 .ts{color:var(--orange-dark);text-shadow:2px 3px 0 rgba(255,255,255,.7)}
.tile.r2{background:linear-gradient(180deg,#fff,#ffe2c2);border-color:var(--orange-dark)}
.tile.r2 .rk{background:var(--orange-dark)}.tile.r2 .ts{color:var(--orange-dark)}
.tile.bump{transform:translateY(-8px) scale(1.07) rotate(-1deg)}
</style></head>
<body>
<div id="ctl">
 <div class="top"><span>✦ SCORE DESK · <span id="room"></span></span><span class="live" id="live">● LIVE</span></div>
 <div class="seg"><button id="mPos">📌 Position</button><button id="mTop">🏆 Highest top</button></div>
 <div class="nav"><button class="p" onclick="cmd('prev')">◀ PREV</button><button class="n" onclick="cmd('next')">NEXT ▶</button></div>
 <div class="hint">slides — no clicker needed (needs slide-clicker.py running on the laptop)</div>
 <div id="rows"></div>
 <details><summary>⚙ SETUP (TEAMS · SYNC · RESET)</summary>
  <label>Team names (one per line)</label><textarea id="names" rows="6"></textarea>
  <div class="act"><button onclick="saveNames()">Apply names</button><button class="dng" onclick="resetScores()">Reset scores</button></div>
  <label>Room code</label><input id="roomIn">
  <div class="act"><button onclick="saveCfg()">Save room</button></div>
  <label>Display link (paste in PPT web-viewer add-in / OBS browser source)</label>
  <div class="links"><a id="dLink" href="#" target="_blank"></a></div>
  <label>Undo</label><div class="act"><button onclick="undo()">↶ Undo last change</button></div>
 </details>
</div>
<div id="dsp"></div>

<script>
const Q=new URLSearchParams(location.search);
const MODE=Q.get('mode')==='display'?'display':'control';
const LS=(k,v)=>v===undefined?localStorage.getItem(k):localStorage.setItem(k,v);
let ROOM=Q.get('room')||LS('qs_room')||'quiz1';
const DEF_URL='https://daeunvrbadtnpktxqyuo.supabase.co',DEF_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZXVudnJiYWR0bnBrdHhxeXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODkzMDUsImV4cCI6MjEwNjg2NTMwNX0.Z8xkPWmArATWBqcck92_8sI6H498uMAOgs4aNG5NX4U';
let SB={url:DEF_URL,key:DEF_KEY};
const remote=()=>SB.url&&SB.key;
const defNames=['Team 1','Team 2','Team 3','Team 4','Team 5','Team 6','Team 7','Team 8'];
let S={teams:defNames.map(n=>({n,s:0})),mode:'pos',rev:0,cmd:'',seq:0};
let hist=[];
if(MODE==='display')document.body.classList.add('display');

/* ---------- ranking (competition ranking: 190,170,170,170,160,160,90,45 -> 1,2,2,2,5,5,7,8) ---------- */
function ranks(){const sorted=[...S.teams.map(t=>t.s)].sort((a,b)=>b-a);return S.teams.map(t=>sorted.indexOf(t.s)+1)}
const ord=r=>r===1?'1ST':r===2?'2ND':r===3?'3RD':'#'+r;
function cls(r){if(r===1)return'r1';if(r===2&&S.mode==='pos')return'r2';return''}

/* ---------- storage / sync ---------- */
const hdr=()=>({apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'});
async function push(){
  S.rev=Date.now();
  const body={room:ROOM,state:S,cmd:S.cmd,cmd_seq:S.seq,updated_at:new Date().toISOString()};
  LS('qs_state_'+ROOM,JSON.stringify(S));
  if(!remote())return setLive(true);
  try{
    const r=await fetch(SB.url+'/rest/v1/quiz_rooms?on_conflict=room',{method:'POST',headers:{...hdr(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});
    setLive(r.ok);
  }catch(e){setLive(false)}
}
async function pull(){
  try{
    if(remote()){
      const r=await fetch(SB.url+'/rest/v1/quiz_rooms?room=eq.'+encodeURIComponent(ROOM)+'&select=state',{headers:hdr()});
      if(!r.ok)return setLive(false);
      const j=await r.json();setLive(true);
      if(j[0]&&j[0].state&&j[0].state.rev!==S.rev){S=j[0].state;render()}
    }else{
      const raw=LS('qs_state_'+ROOM);
      if(raw){const o=JSON.parse(raw);if(o.rev!==S.rev){S=o;render()}}
    }
  }catch(e){setLive(false)}
}
function setLive(ok){const l=document.getElementById('live');if(!l)return;l.classList.toggle('off',!ok);l.textContent=ok?'● LIVE':'● OFFLINE'}

/* ---------- controller actions ---------- */
function snap(){hist.push(JSON.stringify(S));if(hist.length>50)hist.shift()}
function add(i,d){snap();S.teams[i].s+=d;render();push()}
function setMode(m){S.mode=m;render();push()}
function cmd(a){S.cmd=a;S.seq++;push();if(navigator.vibrate)navigator.vibrate(30)}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());render();push()}
function resetScores(){if(!confirm('Reset all scores to 0?'))return;snap();S.teams.forEach(t=>t.s=0);render();push()}
function saveNames(){
  const n=document.getElementById('names').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12);
  if(!n.length)return;snap();
  S.teams=n.map((nm,i)=>({n:nm,s:S.teams[i]?S.teams[i].s:0}));render();push();
}
function saveCfg(){
  ROOM=document.getElementById('roomIn').value.trim()||'quiz1';
  LS('qs_room',ROOM);
  render();push();
}

/* ---------- render ---------- */
function render(){
  const R=ranks();
  if(MODE==='display'){
    const d=document.getElementById('dsp');
    const prev={};d.querySelectorAll('.tile').forEach((t,i)=>prev[i]=t.dataset.s);
    d.innerHTML=S.teams.map((t,i)=>`<div class="tile ${cls(R[i])}" data-s="${t.s}"><span class="rk">${ord(R[i])}</span><div class="tn">${esc(t.n)}</div><div class="ts">${t.s}</div></div>`).join('');
    d.querySelectorAll('.tile').forEach((t,i)=>{if(prev[i]!==undefined&&prev[i]!==t.dataset.s){t.classList.add('bump');setTimeout(()=>t.classList.remove('bump'),350)}});
    return;
  }
  document.getElementById('room').textContent=ROOM;
  document.getElementById('mPos').classList.toggle('on',S.mode==='pos');
  document.getElementById('mTop').classList.toggle('on',S.mode==='top');
  document.getElementById('rows').innerHTML=S.teams.map((t,i)=>`<div class="row ${cls(R[i])}"><div class="nm">${esc(t.n)}<small>${ord(R[i])}</small></div><div class="sc">${t.s}</div><button class="b g" onclick="add(${i},10)">+10</button><button class="b l" onclick="add(${i},5)">+5</button><button class="b m" onclick="add(${i},-5)">−5</button></div>`).join('');
  const a=document.activeElement;
  if(!a||a.id!=='names')document.getElementById('names').value=S.teams.map(t=>t.n).join('\n');
  if(!a||a.tagName!=='INPUT'){roomIn.value=ROOM}
  const u=location.origin&&location.origin!=='null'?location.origin+location.pathname:location.href.split('?')[0];
  const link=u+'?mode=display&room='+encodeURIComponent(ROOM);
  const dl=document.getElementById('dLink');dl.href=link;dl.textContent=link;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('mPos').onclick=()=>setMode('pos');
document.getElementById('mTop').onclick=()=>setMode('top');

/* init */
(function(){
  const raw=LS('qs_state_'+ROOM);if(raw){try{S=JSON.parse(raw)}catch(e){}}
  render();
  if(MODE==='control'){push()}
  setInterval(()=>{if(MODE==='display')pull()},600);
  window.addEventListener('storage',()=>{if(MODE==='display')pull()});
  if(MODE==='display')pull();
})();
</script></body></html>
